<div class="map-shell">
	<div #mapElement class="map"></div>

	@if (mapOverlay.overlay(); as overlay) {
		<div class="map-overlay" [class.beside-panel]="controls.open()">
			<ng-container *ngComponentOutlet="overlay.component; injector: overlay.injector" />
		</div>
	}

	<app-controls-panel [stationAvailable]="!!stationTimetable.stop()">
		<!-- Above the tab, so it is seen whichever tab is open and however long it is -->
		@if (mapError() || routeCatalog.loadError() || routeSelection.loadError()) {
			<p class="load-error" role="alert">Transit data could not be loaded.</p>
		}

		<router-outlet />
	</app-controls-panel>
</div>
