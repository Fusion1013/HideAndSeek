<section class="menu-content" aria-label="Transit line visibility">
	<div class="route-filters" role="group" aria-label="Filter routes">
		<div class="control-field">
			<label for="route-search">Search routes</label>
			<input
				id="route-search"
				type="search"
				[value]="filters.search()"
				placeholder="Name, agency, or route ID"
				(input)="setSearch($event)"
			>
		</div>
		<div class="route-filter-row">
			<label class="control-field" for="agency-filter">
				Agency
				<select id="agency-filter" [value]="filters.agency()" (change)="setAgency($event)">
					<option value="">All agencies</option>
					@for (agency of catalog.agencies(); track agency) {
						<option [value]="agency">{{ agency }}</option>
					}
				</select>
			</label>
			<label class="control-field" for="route-type-filter">
				Mode
				<select id="route-type-filter" [value]="filters.routeType()" (change)="setRouteType($event)">
					<option value="">All modes</option>
					@for (routeType of catalog.routeTypes(); track routeType) {
						<option [value]="routeType">{{ routeTypeLabel(routeType) }}</option>
					}
				</select>
			</label>
		</div>
		<div class="filter-footer">
			<label class="check-field">
				<input type="checkbox" [checked]="chosenOnly()" (change)="setChosenOnly($event)">
				Only selected routes
			</label>
			<div class="panel-actions">
				<button type="button" [disabled]="filters.activeFilterCount() === 0 && !chosenOnly()" (click)="clearFilters()">
					Clear filters
				</button>
			</div>
		</div>
	</div>
	<div class="panel-heading">
		<h3 id="routes-heading">Routes</h3>
		<span aria-live="polite">{{ selection.selectedRouteIds().length }} selected · {{ shown().length }} shown</span>
	</div>
	<div class="panel-actions">
		<button type="button" (click)="selectShown()">Select shown</button>
		<button type="button" (click)="selection.selectRoutesInView()">Routes in view</button>
		<button type="button" (click)="selectNone()">None</button>
	</div>
	<app-route-checklist
		listId="line-list"
		[routes]="listed()"
		[chosen]="chosen()"
		label="Transit lines to show on the map"
		emptyText="No routes match the filters."
		(toggled)="toggle($event.routeId, $event.chosen)"
	/>
	@if (shown().length > listed().length) {
		<p class="status-text">{{ shown().length - listed().length }} more; search or filter to narrow the list.</p>
	}
</section>
