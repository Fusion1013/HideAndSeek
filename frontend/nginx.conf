# The app and its API are served under /hideandseek/; the build's <base href> matches it (angular.json)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Redirects keep whatever host and scheme the browser used (https through Caddy, http on port 4200)
  absolute_redirect off;

  location = / {
    return 302 /hideandseek/;
  }

  location = /hideandseek {
    return 301 /hideandseek/;
  }

  # A game's event stream: held open for up to 30 minutes, events passed on as they come
  location ~ ^/hideandseek/api/games/[^/]+/events$ {
    rewrite ^/hideandseek(/.*)$ $1 break;
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    # Longer than the backend's stream timeout; heartbeats every 20 seconds keep it from idling out sooner
    proxy_read_timeout 35m;
  }

  location /hideandseek/api/ {
    proxy_pass http://backend:8080/api/;
    # Above the backend's limit for a photo answering a question, so it is the one to refuse with a reason
    client_max_body_size 11m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Caddy's entry for the client, then nginx's for Caddy: the backend's rate limits go by the client's address
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The path the browser sees the API under, for the paths of the cookies the backend sets
    proxy_set_header X-Forwarded-Prefix /hideandseek;
  }

  location /v3/api-docs {
    proxy_pass http://backend:8080/v3/api-docs;
  }

  location /swagger-ui/ {
    proxy_pass http://backend:8080/swagger-ui/;
  }

  location /hideandseek/ {
    try_files $uri $uri/ /hideandseek/index.html;
  }
}
