openapi: 3.0.3
info:
  title: Jetlag API
  version: 1.0.0
  description: API shared by the Jetlag frontend and backend.
servers:
  - url: /
paths:
  /api/hello:
    get:
      tags:
        - Hello
      operationId: getHello
      summary: Get a greeting from the backend
      responses:
        '200':
          description: Greeting text
          content:
            text/plain:
              schema:
                type: string