server:
  # The client's address from X-Forwarded-For, as set by the proxies in front (Caddy, then nginx); trusted only
  # from private network addresses, so clients cannot set their own (see RateLimitConfig)
  forward-headers-strategy: native

spring:
  application:
    name: jetlag-backend
  # Local overrides (database login, API keys) live in a git-ignored file; see
  # backend/config/application-local.properties.example. Listed twice so it is found whether the app
  # is started from backend/ or from the repository root.
  config:
    import:
      - optional:file:./config/application-local.properties
      - optional:file:./backend/config/application-local.properties
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jetlag}
    username: ${SPRING_DATASOURCE_USERNAME:jetlag}
    password: ${SPRING_DATASOURCE_PASSWORD:jetlag}
  mvc:
    problemdetails:
      # Errors as RFC 7807 bodies, whose "detail" carries the reason given to ResponseStatusException
      enabled: true
  flyway:
    # Databases created before Flyway already have the GTFS and Overpass tables: mark them as version 0 so
    # V1 (PostGIS and the game tables) still runs on them
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      # Only for the GTFS and Overpass tables; Flyway owns the game tables (see FlywayOwnedTables)
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          schema_filter_provider: com.jetlag.config.FlywayOwnedTables
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

trafiklab:
  # Static GTFS data (Sweden 3), used by the GTFS import
  static-api-key: ${TRAFIKLAB_STATIC_API_KEY:}
  # GTFS Realtime (Sweden 3), used for vehicle positions
  realtime-api-key: ${TRAFIKLAB_REALTIME_API_KEY:}
  realtime-operator: ${TRAFIKLAB_REALTIME_OPERATOR:jlt}

gtfs:
  update:
    # Whether the scheduled GTFS import runs at all (env: GTFS_UPDATE_ENABLED)
    enabled: true
    initial-delay-ms: 10000
    fixed-delay-ms: 86400000

game:
  cleanup:
    # A game with no activity for this long is ended
    idle-after: PT24H
    # A finished game, with its players' positions, is deleted after this long (e.g. P90D). Empty: finished games
    # are kept, so their players can look back at them (env: GAME_CLEANUP_KEEP_FINISHED_FOR)
    keep-finished-for: ${GAME_CLEANUP_KEEP_FINISHED_FOR:}
    interval: PT1H
  rate-limits:
    # Requests per client IP per minute; beyond that, 429 Too Many Requests
    join-per-minute: 10
    create-game-per-minute: 5
    create-template-per-minute: 10

push:
  # Who runs the server, for push services to contact about its notifications: a mailto: or https: address
  # (env: PUSH_SUBJECT). Apple refuses localhost addresses.
  subject: ${PUSH_SUBJECT:mailto:jetlag@example.com}

overpass:
  base-url: https://overpass-api.de/api/interpreter
  update:
    # Whether the scheduled Overpass import runs at all (env: OVERPASS_UPDATE_ENABLED)
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
