spring:
  application:
    name: jetlag-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jetlag}
    username: ${SPRING_DATASOURCE_USERNAME:jetlag}
    password: ${SPRING_DATASOURCE_PASSWORD:jetlag}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html