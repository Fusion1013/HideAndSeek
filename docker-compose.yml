services:
  # HTTPS entry point; see caddy/Caddyfile
  proxy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-jetlag}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jetlag}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jetlag}
      TRAFIKLAB_STATIC_API_KEY: ${TRAFIKLAB_STATIC_API_KEY:-}
      TRAFIKLAB_REALTIME_API_KEY: ${TRAFIKLAB_REALTIME_API_KEY:-}
      GTFS_UPDATE_ENABLED: ${GTFS_UPDATE_ENABLED:-true}
      OVERPASS_UPDATE_ENABLED: ${OVERPASS_UPDATE_ENABLED:-true}
      # Contact address push services may use about the server's notifications (mailto: or https:)
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:jetlag@example.com}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  database:
    # PostGIS is required for the overpass_geometry column
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jetlag}
      POSTGRES_USER: ${POSTGRES_USER:-jetlag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jetlag}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jetlag} -d ${POSTGRES_DB:-jetlag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
