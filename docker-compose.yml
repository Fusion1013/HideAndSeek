services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-jetlag}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jetlag}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jetlag}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jetlag}
      POSTGRES_USER: ${POSTGRES_USER:-jetlag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jetlag}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jetlag} -d ${POSTGRES_DB:-jetlag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: